[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fauxphonic"
version = "0.2.2"
description = "Private, native Windows audio mastering"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6==6.11.2", "numpy==2.5.3", "soundfile==0.13.1", "psutil==7.2.2", "onnxruntime==1.30.0"]

[project.scripts]
local-audio = "local_audio_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
